name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-admin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      ICHQ_TEST_ADMIN_URL: postgresql://postgres:ci-admin@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Installieren (Lockfile mit Hashes)
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
          pip install "pytest>=8" "httpx>=0.27" "moto[s3]>=5" "ruff>=0.6" "mypy>=1.11" "import-linter>=2" pip-audit \
            "shellcheck-py==0.11.0.1"
      - name: Browser für die Oberflächentests (nur Test, nicht im Produkt)
        run: |
          pip install "playwright==1.56.0"
          python -m playwright install --with-deps chromium
      - name: Lint
        run: ruff check src tests windows scripts
      - name: Typen Windows-Launcher
        run: mypy --strict windows/launcher
      - name: Typen
        run: mypy
      - name: Schichtregeln
        run: lint-imports
      - name: Tests gegen PostgreSQL
        run: pytest -q
      - name: Bekannte Sicherheitslücken
        run: pip-audit -r requirements.lock --require-hashes
      - name: Image bauen
        run: docker build -f deploy/Dockerfile -t ic-ware-hq:ci .

  mutation:
    # Prüft, ob die Tests eingebaute Sicherheitslücken finden. Langsamer, deshalb eigener Job.
    runs-on: ubuntu-24.04
    needs: checks
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: ci-admin}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      ICHQ_TEST_ADMIN_URL: postgresql://postgres:ci-admin@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
          pip install "pytest>=8" "httpx>=0.27" "moto[s3]>=5" "playwright==1.56.0"
          python -m playwright install --with-deps chromium
      - run: scripts/mutation-check.sh

  betrieb:
    # Ende-zu-Ende auf einem frischen Server: Installer, HTTPS über Caddy, echte Virenprüfung (ClamAV, EICAR),
    # Sicherung → Totalverlust → Neuinstallation → Wiederherstellung, Neustart des Docker-Dienstes (ADR-015).
    runs-on: ubuntu-24.04
    needs: checks
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: S3-Testziel für die Sicherung (moto, nur Test)
        run: |
          pip install "moto[server]>=5,<6"
          nohup moto_server -H 127.0.0.1 -p 9000 > /tmp/moto.log 2>&1 &
          sleep 5
          AWS_ACCESS_KEY_ID=ci AWS_SECRET_ACCESS_KEY=ci python -c "import boto3; boto3.client('s3',
            endpoint_url='http://127.0.0.1:9000', region_name='eu-central-1').create_bucket(Bucket='ichq-ci',
            CreateBucketConfiguration={'LocationConstraint': 'eu-central-1'})"
          sudo install -d -m 700 /etc/ichq
          printf 'AWS_ACCESS_KEY_ID=ci\nAWS_SECRET_ACCESS_KEY=ci\nAWS_DEFAULT_REGION=eu-central-1\n' \
            | sudo tee /etc/ichq/backup-s3.env > /dev/null
      - name: Installieren (wie auf einem Server, Domain localhost, Sicherung nach S3)
        run: >
          sudo deploy/install.sh --domain localhost --email ci@example.org --skip-dns-check --no-systemd
          --backup-repository s3:http://127.0.0.1:9000/ichq-ci/hq
      - name: Ende-zu-Ende-Test
        run: sudo deploy/smoke-test.sh --wegwerf --docker-neustart
      - name: Logs bei Fehler
        if: failure()
        run: sudo docker compose -f deploy/docker-compose.yml --env-file deploy/.env logs --tail 150

  windows:
    # Windows-Installer bauen und auf einem echten Windows-Runner installieren/prüfen (ADR-017)
    uses: ./.github/workflows/windows.yml
