name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-admin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      ICHQ_TEST_ADMIN_URL: postgresql://postgres:ci-admin@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Installieren (Lockfile mit Hashes)
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
          pip install "pytest>=8" "httpx>=0.27" "moto[s3]>=5" "ruff>=0.6" "mypy>=1.11" "import-linter>=2" pip-audit \
            "shellcheck-py==0.11.0.1"
      - name: Browser für die Oberflächentests (nur Test, nicht im Produkt)
        run: |
          pip install "playwright==1.56.0"
          python -m playwright install --with-deps chromium
      - name: Lint
        run: ruff check src tests
      - name: Typen
        run: mypy
      - name: Schichtregeln
        run: lint-imports
      - name: Tests gegen PostgreSQL
        run: pytest -q
      - name: Bekannte Sicherheitslücken
        run: pip-audit -r requirements.lock --require-hashes
      - name: Image bauen
        run: docker build -f deploy/Dockerfile -t ic-ware-hq:ci .

  mutation:
    # Prüft, ob die Tests eingebaute Sicherheitslücken finden. Langsamer, deshalb eigener Job.
    runs-on: ubuntu-24.04
    needs: checks
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: ci-admin}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      ICHQ_TEST_ADMIN_URL: postgresql://postgres:ci-admin@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
          pip install "pytest>=8" "httpx>=0.27" "moto[s3]>=5" "playwright==1.56.0"
          python -m playwright install --with-deps chromium
      - run: scripts/mutation-check.sh

  betrieb:
    # Ende-zu-Ende auf einem frischen Server: Installer, HTTPS über Caddy, echte Virenprüfung (ClamAV, EICAR),
    # Sicherung → Totalverlust → Neuinstallation → Wiederherstellung, Neustart des Docker-Dienstes (ADR-015).
    runs-on: ubuntu-24.04
    needs: checks
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Installieren (wie auf einem Server, Domain localhost)
        run: sudo deploy/install.sh --domain localhost --email ci@example.org --skip-dns-check --no-systemd
      - name: Ende-zu-Ende-Test
        run: sudo deploy/smoke-test.sh --wegwerf --docker-neustart
      - name: Logs bei Fehler
        if: failure()
        run: sudo docker compose -f deploy/docker-compose.yml --env-file deploy/.env logs --tail 150
