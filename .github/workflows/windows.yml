name: Windows-Installer
# Baut den Windows-Launcher + Installer (ADR-017) und prüft ihn ECHT auf einem Windows-Runner: stille Installation,
# Verknüpfungen, Launcher-Kommandozeile, Deinstallation. Wird von CI (jeder PR) und Release (Tag v*) aufgerufen.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Launcher-Logik (ohne Server; die Prüfung gegen den echten Server läuft im Linux-Job)
        shell: pwsh
        run: |
          python windows/launcher/ichq_launcher.py --version
          python windows/launcher/ichq_launcher.py --check http://hq.beispiel-firma.de; if ($LASTEXITCODE -ne 2) { throw "http:// nicht abgelehnt" }
          python -c "import tkinter; print('tkinter', tkinter.TkVersion)"
      - name: Bauen (PyInstaller + Inno Setup)
        shell: pwsh
        run: windows/build.ps1
      - name: Installer prüfen (installieren, Verknüpfungen, Launcher, deinstallieren)
        shell: pwsh
        run: windows/test-installer.ps1
      - name: Server-Skripte — Windows PowerShell 5.1 kann sie lesen (läuft so auf dem PC)
        shell: powershell
        run: |
          $fehler = 0
          foreach ($f in Get-ChildItem windows\server -Recurse -Include *.ps1, *.psm1) {
            $e = $null; [void][Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$e)
            if ($e) { $e | ForEach-Object { Write-Host "$($f.Name): $($_.Message) (Zeile $($_.Extent.StartLineNumber))" }; $fehler++ }
          }
          if ($fehler) { throw "$fehler Dateien mit Syntaxfehlern" }
      - name: Server-Skripte — PSScriptAnalyzer und Pester (gepinnt)
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          $b = Invoke-ScriptAnalyzer -Path windows -Recurse -Severity Error, Warning -ExcludeRule PSAvoidUsingWriteHost
          $b | Format-Table RuleName, ScriptName, Line, Message -AutoSize -Wrap | Out-String -Width 250 | Write-Host
          if ($b) { throw "PSScriptAnalyzer: $(@($b).Count) Befunde" }
          Import-Module Pester -RequiredVersion 5.7.1
          $c = New-PesterConfiguration; $c.Run.Path = 'windows/server/tests'; $c.Run.Exit = $true
          $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c
      - name: Server-Installer bauen (WSL2 + Linux-Stack + Cloudflare-Tunnel, ADR-018)
        shell: pwsh
        run: windows/build-server.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: IC-WARE-HQ-Server-Installer
          path: |
            dist/IC-WARE-HQ-Server-Setup-*.exe
            dist/IC-WARE-HQ-Server-Setup-*.exe.sha256
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: IC-WARE-HQ-Windows-Installer
          path: |
            dist/IC-WARE-HQ-Setup-*.exe
            dist/IC-WARE-HQ-Setup-*.exe.sha256
          if-no-files-found: error
          retention-days: 30
