# Einzelserver-Betrieb (M0, Abschnitt 29; ADR-015). Einrichtung: deploy/install.sh — oder von Hand:
#   deploy/generate-secrets.sh && printf 'ICHQ_DOMAIN=…\nICHQ_ACME_EMAIL=…\n' > deploy/.env
#   docker build -f deploy/Dockerfile -t ic-ware-hq:local . && docker compose -f deploy/docker-compose.yml up -d
# Bedienung danach: deploy/hq (status, logs, update, backup, restore, setup-admin …)
name: ichq

x-app-env: &app-env
  ICHQ_ENV: production
  ICHQ_DATABASE_URL_FILE: /run/secrets/database_url
  ICHQ_PLATFORM_DATABASE_URL_FILE: /run/secrets/platform_database_url
  ICHQ_WORKER_DATABASE_URL_FILE: /run/secrets/worker_database_url
  ICHQ_AUTH_DATABASE_URL_FILE: /run/secrets/auth_database_url
  ICHQ_PUBLIC_ORIGIN: https://${ICHQ_DOMAIN:?ICHQ_DOMAIN fehlt — deploy/.env anlegen (deploy/install.sh)}
  ICHQ_TRUSTED_PROXIES: "*"   # nur Caddy erreicht die App (internes Netz); App-Port ist nicht veröffentlicht
  ICHQ_MIGRATION_DATABASE_URL_FILE: /run/secrets/migration_database_url
  ICHQ_SECRET_KEY_FILE: /run/secrets/secret_key
  ICHQ_SESSION_SECRET_FILE: /run/secrets/session_secret
  # Einzelserver: Dateien auf einem Docker-Volume (ADR-015). S3 bleibt möglich: ICHQ_STORAGE_BACKEND=s3 + S3-Variablen.
  ICHQ_STORAGE_BACKEND: local
  ICHQ_STORAGE_PATH: /var/lib/ichq/storage
  ICHQ_LOG_FORMAT: json
  # E-Mail (ADR-016) — Werte aus deploy/.env (deploy/install.sh --smtp-…), Passwort als Secret-Datei
  ICHQ_SMTP_HOST: ${ICHQ_SMTP_HOST:-}
  ICHQ_SMTP_PORT: ${ICHQ_SMTP_PORT:-587}
  ICHQ_SMTP_USER: ${ICHQ_SMTP_USER:-}
  ICHQ_SMTP_FROM: ${ICHQ_SMTP_FROM:-}
  ICHQ_SMTP_STARTTLS: ${ICHQ_SMTP_STARTTLS:-true}
  ICHQ_SMTP_SSL: ${ICHQ_SMTP_SSL:-false}
  ICHQ_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
  ICHQ_ALERT_EMAIL: ${ICHQ_ALERT_EMAIL:-}

x-app-secrets: &app-secrets
  - database_url
  - platform_database_url
  - worker_database_url
  - auth_database_url
  - migration_database_url
  - secret_key
  - session_secret
  - smtp_password

x-app: &app
  image: ic-ware-hq:local     # gebaut von deploy/hq build (install/update), nie aus einer Registry
  pull_policy: never
  environment: *app-env
  secrets: *app-secrets
  volumes: [filedata:/var/lib/ichq/storage]
  logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_admin_password
    secrets: [pg_admin_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 20
    logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
    restart: unless-stopped

  db-init:          # legt Rollen und Datenbank an (idempotent)
    image: postgres:16-alpine
    depends_on: {postgres: {condition: service_healthy}}
    secrets: [pg_admin_password, pg_owner_password, pg_app_password, pg_platform_password, pg_worker_password,
              pg_auth_password]
    volumes: [./postgres/init-roles.sql:/init-roles.sql:ro]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        PGPASSWORD=$$(cat /run/secrets/pg_admin_password) psql -h postgres -U postgres -v ON_ERROR_STOP=1
        -v owner_pw="$$(cat /run/secrets/pg_owner_password)" -v app_pw="$$(cat /run/secrets/pg_app_password)"
        -v platform_pw="$$(cat /run/secrets/pg_platform_password)" -v worker_pw="$$(cat /run/secrets/pg_worker_password)"
        -v auth_pw="$$(cat /run/secrets/pg_auth_password)"
        -v dbname=ichq -f /init-roles.sql
    restart: "no"

  migrate:          # Migration vor jedem Start der App
    <<: *app
    depends_on: {db-init: {condition: service_completed_successfully}}
    command: ["ichq", "migrate"]
    restart: "no"

  app:
    <<: *app
    depends_on: {migrate: {condition: service_completed_successfully}}
    restart: unless-stopped

  worker:
    <<: *app
    depends_on: {migrate: {condition: service_completed_successfully}}
    command: ["ichq", "worker"]
    healthcheck:   # Lebenszeichen je Runde; hängt der Worker, wird er "unhealthy" (deploy/hq check meldet das)
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(time.time()-os.path.getmtime('/tmp/ichq-worker.heartbeat')>120)"]
      interval: 30s
      start_period: 60s
    restart: unless-stopped

  jobs:             # geplante Jobs ohne Host-Abhängigkeit: idempotent, Advisory-Lock gegen Parallellauf (ADR-015)
    <<: *app
    depends_on: {migrate: {condition: service_completed_successfully}}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        while :; do
        ichq notifications-scan && ichq auth-cleanup && touch /tmp/ichq-jobs.heartbeat
        || echo "Job fehlgeschlagen — Lebenszeichen bleibt alt, deploy/hq check meldet das";
        sleep 3600; done
    healthcheck:   # nur bei Erfolg erneuert: ein dauerhaft scheiternder Job fällt nach 2 h auf
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(time.time()-os.path.getmtime('/tmp/ichq-jobs.heartbeat')>7500)"]
      interval: 5m
      start_period: 10m
    restart: unless-stopped

  clamav:           # Virenscanner (ClamAV); lädt beim ersten Start Signaturen (einige Minuten), ~1,5 GB RAM
    image: clamav/clamav:stable
    volumes: [clamdb:/var/lib/clamav]
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
    restart: unless-stopped

  scanner:          # prüft Dokumente in Quarantäne; ohne erreichbares ClamAV bleibt alles gesperrt (ADR-015)
    <<: *app
    depends_on: {migrate: {condition: service_completed_successfully}}
    environment:
      <<: *app-env
      ICHQ_CLAMD_HOST: clamav
    command: ["ichq", "documents-scan", "--loop", "10"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(time.time()-os.path.getmtime('/tmp/ichq-scanner.heartbeat')>120)"]
      interval: 30s
      start_period: 60s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on: {app: {condition: service_healthy}}   # sonst 503, bis der erste Health-Check läuft
    # Direktbetrieb: 80/443 für alle (Let's Encrypt). Tunnelbetrieb (ADR-018): ICHQ_BIND=127.0.0.1 — nur dieser Rechner.
    ports: ["${ICHQ_BIND:-0.0.0.0}:80:80", "${ICHQ_BIND:-0.0.0.0}:443:443", "${ICHQ_BIND:-0.0.0.0}:443:443/udp"]
    environment:
      ICHQ_DOMAIN: ${ICHQ_DOMAIN}
      ICHQ_ACME_EMAIL: ${ICHQ_ACME_EMAIL:?ICHQ_ACME_EMAIL fehlt — Let's-Encrypt-Kontakt in deploy/.env}
    volumes:
      - ./${ICHQ_CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    networks: [default, tunnel]
    logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
    restart: unless-stopped

  cloudflared:
    # Nur im Tunnelbetrieb (deploy/install.sh --tunnel): ausgehende Verbindung zu Cloudflare, kein offener Port.
    # Sieht nur Caddy (Netz „tunnel"), nie App oder Datenbank. Feste Adresse = einzige vertrauenswürdige Quelle der
    # Besucher-IP in Caddyfile.tunnel.
    image: cloudflare/cloudflared:2026.9.3
    profiles: [tunnel]
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20241", "run",
              "--token-file", "/run/secrets/cloudflare_tunnel_token"]
    secrets: [cloudflare_tunnel_token]
    depends_on: {caddy: {condition: service_started}}
    networks:
      tunnel: {ipv4_address: 172.31.250.10}
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      start_period: 30s
    logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
    restart: unless-stopped

networks:
  default: {}
  tunnel:
    ipam:
      config: [{subnet: 172.31.250.0/28}]

secrets:
  pg_admin_password: {file: ../secrets/pg_admin_password}
  pg_owner_password: {file: ../secrets/pg_owner_password}
  pg_app_password: {file: ../secrets/pg_app_password}
  pg_platform_password: {file: ../secrets/pg_platform_password}
  pg_worker_password: {file: ../secrets/pg_worker_password}
  pg_auth_password: {file: ../secrets/pg_auth_password}
  database_url: {file: ../secrets/database_url}
  platform_database_url: {file: ../secrets/platform_database_url}
  worker_database_url: {file: ../secrets/worker_database_url}
  auth_database_url: {file: ../secrets/auth_database_url}
  migration_database_url: {file: ../secrets/migration_database_url}
  secret_key: {file: ../secrets/secret_key}
  session_secret: {file: ../secrets/session_secret}
  smtp_password: {file: ../secrets/smtp_password}      # leer = kein SMTP-Login
  cloudflare_tunnel_token: {file: ../secrets/cloudflare_tunnel_token}   # leer = kein Tunnel (ADR-018)

volumes:
  pgdata:
  filedata:
  caddydata:
  caddyconfig:
  clamdb:
